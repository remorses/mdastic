<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="/skill/claude-style/style.css" />
  </head>
  <body>
    <div class="canvas" id="diagram"></div>
    <script type="module">
      import { barChart } from '/skill/charts.ts'
      const ms = (v) => `${v} ms`
      barChart('#diagram', {
        series: ['remark', 'mdastic'],
        ratioHeader: 'Faster',
        axisTitle: 'Median time for the whole corpus, Node 24, Apple M5 Pro',
        charts: [
          {
            title: 'Parse',
            legend: true,
            max: 800,
            ticks: [0, 200, 400, 600, 800],
            unit: ms,
            rows: [
              { label: 'Markdown + GFM, 2.6 MB', values: [703.4, 24.65], text: ['703 ms', '24.7 ms'], ratio: '×28.5' },
              { label: 'MDX with estree, 1 MB', values: [289.3, 16.83], text: ['289 ms', '16.8 ms'], ratio: '×17.2' },
            ],
          },
          {
            title: 'Stringify',
            max: 800,
            ticks: [0, 200, 400, 600, 800],
            unit: ms,
            rows: [
              { label: 'Markdown + GFM, 2.6 MB', values: [295.93, 39.03], text: ['296 ms', '39.0 ms'], ratio: '×7.6' },
              { label: 'MDX, 1 MB', values: [114.83, 15.02], text: ['115 ms', '15.0 ms'], ratio: '×7.6' },
            ],
          },
          {
            title: 'Round trip (parse + stringify)',
            max: 800,
            ticks: [0, 200, 400, 600, 800],
            unit: ms,
            rows: [
              { label: 'MDX, 1 MB', values: [439.64, 34.72], text: ['440 ms', '34.7 ms'], ratio: '×12.7' },
            ],
          },
        ],
      })
    </script>
  </body>
</html>
