<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="/skill/claude-style/style.css" />
  </head>
  <body>
    <div class="canvas" id="diagram"></div>

      import { barChart } from '/skill/charts.ts'
      const ms = (v) => `${v} ms`
      barChart('#diagram', {
        series: ['remark', 'mdastic'],

        axisTitle: 'Median time for the whole corpus, Apple M5 Pro. Bun AOT compiles both to machine code',
        charts: [
          {
            title: 'Parse',
            legend: true,
            max: 800,
            ticks: [0, 200, 400, 600, 800],
            unit: ms,
            rows: [
              { label: 'Markdown + GFM, Node 24', values: [773.84, 26.53], text: ['774 ms', '26.5 ms'], ratio: '×29.2' },
              { label: 'Markdown + GFM, Bun AOT', values: [583.6, 20.96], text: ['584 ms', '21.0 ms'], ratio: '×27.8' },
              { label: 'MDX with estree, Node 24', values: [316.85, 17.82], text: ['317 ms', '17.8 ms'], ratio: '×17.8' },
              { label: 'MDX with estree, Bun AOT', values: [244.88, 11.1], text: ['245 ms', '11.1 ms'], ratio: '×22.1' },
            ],
          },
          {
            title: 'Stringify',
            max: 800,
            ticks: [0, 200, 400, 600, 800],
            unit: ms,
            rows: [
              { label: 'Markdown + GFM, Node 24', values: [253.0, 42.07], text: ['253 ms', '42.1 ms'], ratio: '×6.0' },
              { label: 'Markdown + GFM, Bun AOT', values: [237.37, 38.89], text: ['237 ms', '38.9 ms'], ratio: '×6.1' },
              { label: 'MDX, Node 24', values: [99.3, 16.76], text: ['99.3 ms', '16.8 ms'], ratio: '×5.9' },
              { label: 'MDX, Bun AOT', values: [91.55, 14.89], text: ['91.6 ms', '14.9 ms'], ratio: '×6.1' },
            ],
          },
          {
            title: 'Round trip (parse + stringify)',
            max: 800,
            ticks: [0, 200, 400, 600, 800],
            unit: ms,
            rows: [
              { label: 'MDX, Node 24', values: [425.89, 35.6], text: ['426 ms', '35.6 ms'], ratio: '×12.0' },
              { label: 'MDX, Bun AOT', values: [345.08, 27.24], text: ['345 ms', '27.2 ms'], ratio: '×12.7' },
            ],
          },
        ],
      })
    </script>
  </body>
</html>
